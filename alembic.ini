# Alembic: esquema de la base del motor Python (docs/deploy/CONVENCIONES.md §3).
# La URL no va aquí: se toma de DATABASE_URL (core/config.py) en migraciones/env.py.
#   alembic upgrade head        # dejar la base en la última versión
#   alembic current             # versión actual
#   alembic downgrade -1        # deshacer la última
#   alembic revision -m "descripcion"   # nueva migración (luego renombrar a NNNN_descripcion.py)
[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
