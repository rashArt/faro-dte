[pytest]
# Suite pytest del fork (docs/deploy/PLAN.md, fase 0). Los scripts históricos de
# tests/scripts/ y el corpus de tests/dorado/ se corren aparte: no son pytest.
testpaths = tests/unit tests/api
norecursedirs = tests/scripts tests/dorado
pythonpath = .
addopts = -ra --strict-markers
markers =
    hallazgo(numero): reproduce un hallazgo de docs/deploy/PLAN.md (tabla Verificación)
