name: manual (GitHub Pages)

# Publica el manual de la API para integraciones (manual/) en GitHub Pages.
# Requisito, una vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [servidor-produccion]
    paths: ["manual/**", ".github/workflows/manual.yml"]
  pull_request:
    paths: ["manual/**", ".github/workflows/manual.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: manual/requirements.txt }
      - run: pip install -r requirements.txt
      - run: zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: manual/site }

  publicar:
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
