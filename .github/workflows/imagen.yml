name: imagen (fork)

# Publica la imagen del servidor en Docker Hub al crear una etiqueta docker-vX.Y.Z
# (imagen X.Y.Z). Paso a paso y la forma manual: docs/deploy/README.md, "Publicar una versión".
#
# Una vez, en GitHub (Settings -> Secrets and variables -> Actions):
#   variable DOCKERHUB_USERNAME   tu usuario de Docker Hub
#   secreto  DOCKERHUB_TOKEN      un Personal access token de Docker Hub con permiso Read & Write
# Sin la variable, el trabajo de publicar se omite (no falla).
on:
  push:
    tags: ["docker-v*"]

jobs:
  pruebas:                       # no se publica una versión con la suite en rojo
    uses: ./.github/workflows/servidor.yml

  publicar:
    needs: pruebas
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # copia limpia de la etiqueta: nada local entra
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5           # docker-v1.2.0 -> etiqueta de imagen 1.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/faro-dte
          flavor: latest=false                    # nunca "latest" para clientes
          tags: type=match,pattern=docker-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
