name: servidor (fork)

# Gates del motor Python como servidor de API (docs/deploy/PLAN.md). No reemplaza a
# dorado.yml, que sigue midiendo la firma y los ports Go/Rust.
on:
  push:
    paths: ["core/**", "api/**", "migraciones/**", "tests/**", "main.py", "alembic.ini", "Dockerfile",
            "requirements*.txt", "constraints.txt", "pytest.ini", ".gitattributes", ".github/workflows/servidor.yml"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: faro_pruebas, POSTGRES_USER: faro, POSTGRES_PASSWORD: clave-de-prueba-ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faro -d faro_pruebas" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Suite pytest (${{ matrix.base }})
        env:
          FARO_TEST_DATABASE_URL: ${{ matrix.base == 'postgres' && 'postgresql+psycopg://faro:clave-de-prueba-ci@localhost:5432/faro_pruebas' || '' }}
          FARO_TEST_PG_DESECHABLE: "1"
          FARO_TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest
      - name: docs/deploy/schema.dbml al día con las migraciones
        if: matrix.base == 'sqlite'
        run: python tools/generar_dbml.py --comprobar

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t faro-dte:ci .
      - name: Corpus dorado dentro de la imagen (15/15, fin de línea LF)
        # Los fixtures (.p12/.pem) no entran en la imagen (.dockerignore): se montan.
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" faro-dte:ci python tests/scripts/test_dorado.py
      - name: Arranca y responde /health
        run: |
          docker run -d --name faro-ci -e ADMIN_PASSWORD=clave-de-prueba-ci faro-dte:ci
          for i in $(seq 1 30); do
            docker exec faro-ci python -c "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()" && exit 0
            sleep 2
          done
          docker logs faro-ci; exit 1
